name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.pages-meta.outputs.artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run test suite with coverage
        run: npm run test:coverage

      - name: Publish coverage summary to Step Summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            if (fs.existsSync('coverage/coverage-summary.json')) {
              const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = summary.total;
              const md = [
                '### 📊 Code Coverage Summary',
                '',
                '| Metric | Total | Covered | Percentage |',
                '| :--- | :--- | :--- | :--- |',
                \`| **Lines** | \${total.lines.total} | \${total.lines.covered} | **\${total.lines.pct}%** |\`,
                \`| **Statements** | \${total.statements.total} | \${total.statements.covered} | **\${total.statements.pct}%** |\`,
                \`| **Functions** | \${total.functions.total} | \${total.functions.covered} | **\${total.functions.pct}%** |\`,
                \`| **Branches** | \${total.branches.total} | \${total.branches.covered} | **\${total.branches.pct}%** |\`,
                ''
              ].join('\n');
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            }
          "

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          overwrite: true

      - name: Build static site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Compute attempt-scoped Pages artifact name
        id: pages-meta
        run: echo "artifact_name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.pages-meta.outputs.artifact_name }}
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for Pages artifact metadata propagation
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          for attempt in $(seq 1 10); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq "[.artifacts[] | select(.name == \"$ARTIFACT_NAME\" and .expired == false)] | length" 2>/dev/null || echo "0")
            if [ "$count" -ge 1 ]; then
              echo "Artifact '$ARTIFACT_NAME' is indexed and ready (count=$count)."
              exit 0
            fi
            echo "Waiting for artifact '$ARTIFACT_NAME' metadata propagation (attempt $attempt/10)..."
            sleep 3
          done
          echo "Proceeding to deploy-pages after polling window."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
