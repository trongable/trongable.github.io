name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run test suite with coverage
        run: npm run test:coverage

      - name: Publish coverage summary to Step Summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            if (fs.existsSync('coverage/coverage-summary.json')) {
              const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = summary.total;
              const md = [
                '### 📊 Code Coverage Summary',
                '',
                '| Metric | Total | Covered | Percentage |',
                '| :--- | :--- | :--- | :--- |',
                \`| **Lines** | \${total.lines.total} | \${total.lines.covered} | **\${total.lines.pct}%** |\`,
                \`| **Statements** | \${total.statements.total} | \${total.statements.covered} | **\${total.statements.pct}%** |\`,
                \`| **Functions** | \${total.functions.total} | \${total.functions.covered} | **\${total.functions.pct}%** |\`,
                \`| **Branches** | \${total.branches.total} | \${total.branches.covered} | **\${total.branches.pct}%** |\`,
                ''
              ].join('\n');
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            }
          "

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Build static site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
